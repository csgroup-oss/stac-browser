{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "stac-browser.fullname" . }}
  namespace: {{ include "stac-browser.namespace" . }}
  labels:
    {{- include "stac-browser.labels" . | nindent 4 }}
    {{- with .Values.httproute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.httproute.parentRefs }}
    {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
    {{- else if .Values.listenerset.enabled }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "stac-browser.fullname" . }}
      namespace: {{ include "stac-browser.namespace" . }}
      sectionName: {{ .Values.listenerset.listenerName }}
    {{- end }}
  {{- if .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml .Values.httproute.hostnames | nindent 4 }}
  {{- else if .Values.listenerset.hostname }}
  hostnames:
    - {{ .Values.listenerset.hostname | quote }}
  {{- end }}
  rules:
    {{- range .Values.httproute.rules }}
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "stac-browser.fullname" $ }}
          port: {{ $.Values.service.port }}
          weight: 1
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}