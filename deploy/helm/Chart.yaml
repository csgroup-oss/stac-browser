# Gateway API resources require the corresponding CRDs beyond this minimum.
kubeVersion: ">=1.23.0-0"

# Chart version. Increment on every chart template or default-value change.
version: 0.4.0

# Upstream STAC Browser application version.
appVersion: 5.1.0
