apiVersion: v2
name: stac-browser
description: A Helm chart for STAC Browser
home: https://github.com/radiantearth/stac-browser
sources:
  - https://github.com/radiantearth/stac-browser
keywords:
  - stac
  - browser
  - geospatial
  - catalog
  - kubernetes

# Application chart containing the templates needed to deploy STAC Browser.
